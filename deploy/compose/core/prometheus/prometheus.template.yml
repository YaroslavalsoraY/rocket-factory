global:
  scrape_interval: ${PROMETHEUS_SCRAPE_INTERVAL}
  evaluation_interval: ${PROMETHEUS_EVALUATION_INTERVAL}

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: order
    metrics_path: /metrics
    static_configs:
      - targets: ["${PROMETHEUS_ORDER_TARGET}"]

  - job_name: assembly
    metrics_path: /metrics
    static_configs:
      - targets: ["${PROMETHEUS_ASSEMBLY_TARGET}"]
