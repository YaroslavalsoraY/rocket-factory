services:
  mongo-inventory:
    image: ${MONGO_IMAGE_NAME}
    
    container_name: mongo-inventory

    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}

      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
  
    volumes:
      - mongo_inventory_data:/data/db
  
    ports:
      - "${EXTERNAL_MONGO_PORT}:27017"
  
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok" | grep -q '^1$'
      interval: 10s
      timeout: 5s
      retries: 5
    
    restart: unless-stopped

    networks:
      - microservices-net
  
  inventory-service:
    build:
      context: ${DOCKERFILE_PATH}
      dockerfile: deploy/docker/inventory/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LOGGER_OTLP_ENDPOINT: ${LOGGER_OTLP_CONTAINER_ENDPOINT}
    networks:
      - microservices-net
    depends_on:
      - mongo-inventory
    ports:
      - "${GRPC_PORT}:${GRPC_PORT}"

volumes:
  mongo_inventory_data:

networks:
  microservices-net:
    external: true

